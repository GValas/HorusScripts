<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>horus — pipelines</title>
<style>
  :root {
    --bg: #0f1117; --panel: #181b24; --panel2: #1f2430; --line: #2a3040;
    --fg: #e6e8ee; --muted: #9aa3b2; --accent: #4f9cf9; --ok: #3fb950;
    --warn: #d29922; --danger: #f85149; --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  header { padding: 14px 20px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 16px; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .tag { font-size: 12px; color: var(--muted); }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 20px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tabs button { background: var(--panel); color: var(--muted); border: 1px solid var(--line);
    padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 14px; }
  .tabs button.active { background: var(--panel2); color: var(--fg); border-color: var(--accent); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 18px; margin-bottom: 16px; }
  .panel h2 { margin: 0 0 12px; font-size: 14px; text-transform: uppercase;
    letter-spacing: .04em; color: var(--muted); }
  .row { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
  .modes label, .steps label { display: inline-flex; align-items: center; gap: 6px;
    background: var(--panel2); border: 1px solid var(--line); border-radius: 8px;
    padding: 7px 12px; cursor: pointer; }
  .steps { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  button.act { border: none; border-radius: 8px; padding: 10px 20px; font-size: 14px;
    font-weight: 600; cursor: pointer; }
  button.go { background: var(--accent); color: #06182f; }
  button.stop { background: var(--danger); color: #2a0606; }
  button.save { background: var(--panel2); color: var(--fg); border: 1px solid var(--line); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .real-warn { color: var(--warn); font-size: 13px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 22px; }
  @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 13px; color: var(--fg); }
  .field .help, .panel > .help { font-size: 11.5px; color: var(--muted); }
  .field input[type=text], .field input[type=password], .field input[type=number],
  .field select, .field textarea {
    background: var(--bg); color: var(--fg); border: 1px solid var(--line);
    border-radius: 6px; padding: 7px 9px; font-size: 13px; font-family: inherit; }
  .field textarea { min-height: 70px; font-family: var(--mono); resize: vertical; }
  .field.bool { flex-direction: row; align-items: center; gap: 8px; }
  .console { background: #07090e; border: 1px solid var(--line); border-radius: 10px;
    height: 46vh; overflow: auto; padding: 12px 14px; font-family: var(--mono);
    font-size: 12.5px; white-space: pre-wrap; color: #cdd3df; }
  .console .cmd { color: var(--accent); }
  .console .end { color: var(--warn); }
  .statusbar { display: flex; align-items: center; gap: 14px; margin-bottom: 10px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
  .dot.run { background: var(--ok); box-shadow: 0 0 8px var(--ok); animation: pulse 1.2s infinite; }
  .dot.err { background: var(--danger); }
  @keyframes pulse { 50% { opacity: .4; } }
  .toast { font-size: 13px; }
  .toast.ok { color: var(--ok); } .toast.err { color: var(--danger); }
  .spacer { flex: 1; }
</style>
</head>
<body>
<header>
  <h1>🦅 horus</h1>
  <span class="tag">lancement &amp; pilotage des pipelines média</span>
</header>

<div class="wrap">
  <div class="tabs" id="tabs"></div>
  <div id="panels"></div>

  <div class="panel">
    <div class="statusbar">
      <span class="dot" id="dot"></span>
      <strong id="statusText">Inactif</strong>
      <span class="tag" id="statusMeta"></span>
      <span class="spacer"></span>
      <button class="act stop" id="stopBtn" disabled>Arrêter</button>
      <button class="save" id="clearBtn">Effacer les logs</button>
    </div>
    <div class="console" id="console"></div>
  </div>
</div>

<script>
let META = null;
let CURRENT = null;        // pipeline actif (onglet)
let STREAM = null;         // EventSource
let RUNNING = false;

const $ = (s, r=document) => r.querySelector(s);
const el = (t, props={}, ...kids) => {
  const n = document.createElement(t);
  for (const [k,v] of Object.entries(props)) {
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  kids.flat().forEach(c => n.append(c));
  return n;
};

async function api(method, path, body) {
  const r = await fetch(path, {
    method,
    headers: body ? {"Content-Type": "application/json"} : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || ("HTTP " + r.status));
  return data;
}

// ── construction de l'UI ──
function buildTabs() {
  const tabs = $("#tabs");
  tabs.innerHTML = "";
  for (const [key, p] of Object.entries(META.pipelines)) {
    tabs.append(el("button", {
      class: key === CURRENT ? "active" : "",
      text: p.label,
      onclick: () => { CURRENT = key; render(); },
    }));
  }
}

function fieldInput(pipeline, f, value) {
  if (f.type === "bool") {
    const cb = el("input", {type: "checkbox", id: inputId(pipeline, f.key)});
    cb.checked = !!value;
    return el("div", {class: "field bool"}, cb,
      el("div", {}, el("label", {for: cb.id, text: f.label}),
        f.help ? el("div", {class: "help", text: f.help}) : ""));
  }
  let input;
  if (f.type === "choice") {
    input = el("select", {id: inputId(pipeline, f.key)});
    f.choices.forEach(c => {
      const o = el("option", {value: c, text: c});
      if (c === value) o.selected = true;
      input.append(o);
    });
  } else if (f.type === "list") {
    input = el("textarea", {id: inputId(pipeline, f.key)});
    input.value = Array.isArray(value) ? value.join("\n") : (value || "");
  } else if (f.type === "int" || f.type === "float") {
    input = el("input", {type: "number", id: inputId(pipeline, f.key)});
    if (f.type === "float") input.setAttribute("step", "any");
    input.value = value ?? "";
  } else { // str, str_or_none
    // Champs secrets (clés d'API) : saisie masquée. La valeur reste stockée en
    // clair dans 00-config.local.py (gitignoré) — c'est une config locale.
    input = el("input", {type: f.secret ? "password" : "text", id: inputId(pipeline, f.key)});
    input.value = value == null ? "" : value;
  }
  return el("div", {class: "field"},
    el("label", {for: input.id, text: f.label}),
    input,
    f.help ? el("div", {class: "help", text: f.help}) : "");
}
const inputId = (p, k) => `cfg-${p}-${k}`;

function readField(pipeline, f) {
  const node = $("#" + inputId(pipeline, f.key));
  if (f.type === "bool") return node.checked;
  if (f.type === "int") return node.value === "" ? 0 : parseInt(node.value, 10);
  if (f.type === "float") return node.value === "" ? 0 : parseFloat(node.value);
  if (f.type === "list") return node.value.split("\n").map(s => s.trim()).filter(Boolean);
  return node.value;
}

async function render() {
  buildTabs();
  const p = META.pipelines[CURRENT];
  const panels = $("#panels");
  panels.innerHTML = "";

  // — bloc lancement —
  const modes = el("div", {class: "row modes"},
    el("label", {}, radio("mode", "dry-run", true), document.createTextNode(" Simulation (dry-run)")),
    el("label", {}, radio("mode", "real", false), document.createTextNode(" Réel")),
  );
  const launchPanel = el("div", {class: "panel"},
    el("h2", {text: "Lancer"}),
    modes,
  );

  let stepsBox = null;
  if (p.steps) {
    stepsBox = el("div", {class: "steps"});
    // [id, description] ou [id, description, cochée_par_défaut] : l'étape 03 du
    // pipeline public (identification en ligne) est décochée par défaut.
    p.steps.forEach(([id, desc, checked]) => {
      const cb = el("input", {type: "checkbox", value: id, id: `step-${id}`});
      cb.checked = checked !== false;
      stepsBox.append(el("label", {title: desc}, cb, document.createTextNode(" " + id + " · " + desc)));
    });
    launchPanel.append(el("div", {style: "margin-top:6px"},
      el("div", {class: "tag", text: "Étapes :"}), stepsBox));
  }

  const goBtn = el("button", {class: "act go", text: "Lancer", onclick: doRun});
  const warn = el("span", {class: "real-warn", id: "realWarn", style: "display:none"},
    "⚠ Mode réel : opérations destructrices (suppression d'originaux, upload).");
  launchPanel.append(el("div", {class: "row", style: "margin-top:14px"}, goBtn, warn));
  panels.append(launchPanel);

  // — bloc config —
  const cfgPanel = el("div", {class: "panel"}, el("h2", {text: "Configuration (" + p.label + ")"}));
  const grid = el("div", {class: "grid"});
  cfgPanel.append(grid);
  const saveBtn = el("button", {class: "act save", text: "Enregistrer la config", onclick: () => saveConfig(CURRENT, p)});
  const toast = el("span", {class: "toast", id: "cfgToast"});
  cfgPanel.append(el("div", {class: "row", style: "margin-top:14px"}, saveBtn, toast));
  panels.append(cfgPanel);

  // valeurs courantes (00-config.py + surcouche 00-config.local.py)
  try {
    const {values, overlay} = await api("GET", "/api/config/" + CURRENT);
    if (overlay) {
      cfgPanel.insertBefore(
        el("div", {class: "help", style: "margin-bottom:10px",
                   text: "Surcouche active : " + overlay + " — ces valeurs écrasent 00-config.py."}),
        grid);
    }
    p.fields.forEach(f => grid.append(fieldInput(CURRENT, f, values[f.key])));
  } catch (e) {
    grid.append(el("div", {class: "toast err", text: "Erreur lecture config : " + e.message}));
  }

  // refléter l'état courant des modes (avertissement réel)
  document.querySelectorAll('input[name=mode]').forEach(r =>
    r.addEventListener("change", () => {
      $("#realWarn").style.display = pickedMode() === "real" ? "inline" : "none";
    }));
  applyRunningState();
}

function radio(name, value, checked) {
  const r = el("input", {type: "radio", name, value});
  if (checked) r.checked = true;
  return r;
}
const pickedMode = () => (document.querySelector('input[name=mode]:checked') || {}).value || "dry-run";

// ── actions ──
async function doRun() {
  const p = META.pipelines[CURRENT];
  const mode = pickedMode();
  let steps = null;
  if (p.steps) {
    steps = [...document.querySelectorAll('.steps input:checked')].map(c => c.value);
    if (steps.length === 0) { alert("Sélectionne au moins une étape."); return; }
  }
  if (mode === "real") {
    const what = p.steps ? `étapes ${steps.join(" ")}` : "01 → 02";
    if (!confirm(`Mode RÉEL sur « ${p.label} » (${what}).\nOpérations destructrices possibles. Continuer ?`)) return;
  }
  // Enregistre d'abord la config affichée dans la surcouche 00-config.local.py :
  // le lanceur relit la config sur le disque, donc sans cette sauvegarde les
  // modifs du formulaire seraient ignorées. Le 00-config.py versionné, lui,
  // n'est jamais réécrit — plus de bruit dans git à chaque lancement.
  const payload = {};
  p.fields.forEach(f => payload[f.key] = readField(CURRENT, f));
  try {
    await api("POST", "/api/config/" + CURRENT, payload);
  } catch (e) {
    alert("Échec de l'enregistrement de la config (lancement annulé) : " + e.message);
    return;
  }
  try {
    $("#console").textContent = "";
    await api("POST", "/api/run", {pipeline: CURRENT, mode, steps});
    openStream();
    await refreshStatus();
  } catch (e) {
    alert("Échec du lancement : " + e.message);
  }
}

async function doStop() {
  if (!confirm("Arrêter le run en cours ?")) return;
  try { await api("POST", "/api/stop"); } catch (e) { alert(e.message); }
}

async function saveConfig(pipeline, p) {
  const payload = {};
  p.fields.forEach(f => payload[f.key] = readField(pipeline, f));
  const toast = $("#cfgToast");
  try {
    await api("POST", "/api/config/" + pipeline, payload);
    toast.className = "toast ok"; toast.textContent = "✓ Enregistré dans 00-config.local.py";
  } catch (e) {
    toast.className = "toast err"; toast.textContent = "✗ " + e.message;
  }
  setTimeout(() => { toast.textContent = ""; }, 4000);
}

// ── logs / statut ──
function appendLine(line) {
  const c = $("#console");
  const atBottom = c.scrollHeight - c.scrollTop - c.clientHeight < 40;
  const cls = line.startsWith("$ ") ? "cmd" : (line.startsWith("===") ? "end" : "");
  c.append(el("div", {class: cls, text: line}));
  if (atBottom) c.scrollTop = c.scrollHeight;
}

function openStream() {
  if (STREAM) STREAM.close();
  STREAM = new EventSource("/api/stream");
  STREAM.onmessage = (e) => appendLine(JSON.parse(e.data).line);
  STREAM.addEventListener("end", () => { STREAM.close(); STREAM = null; refreshStatus(); });
  STREAM.onerror = () => { /* le navigateur retentera ; ignore */ };
}

function setRunning(running, meta) {
  RUNNING = running;
  const dot = $("#dot"), txt = $("#statusText"), sub = $("#statusMeta");
  if (running) {
    dot.className = "dot run"; txt.textContent = "En cours";
  } else if (meta && meta.exit_code != null && meta.exit_code !== 0) {
    dot.className = "dot err"; txt.textContent = "Échec";
  } else {
    dot.className = "dot"; txt.textContent = meta && meta.pipeline ? "Terminé" : "Inactif";
  }
  sub.textContent = meta && meta.pipeline
    ? `${meta.pipeline} · ${meta.mode}${meta.steps && meta.steps.length ? " · " + meta.steps.join(" ") : ""}`
      + (meta.started ? ` · ${meta.started}` : "")
      + (meta.exit_code != null ? ` · code ${meta.exit_code}` : "")
    : "";
  applyRunningState();
}

function applyRunningState() {
  $("#stopBtn").disabled = !RUNNING;
  document.querySelectorAll("button.go").forEach(b => b.disabled = RUNNING);
}

async function refreshStatus() {
  try {
    const s = await api("GET", "/api/status");
    setRunning(s.running, s.meta);
    return s;
  } catch (e) { return null; }
}

// ── init ──
(async function init() {
  $("#stopBtn").addEventListener("click", doStop);
  $("#clearBtn").addEventListener("click", () => { $("#console").textContent = ""; });
  META = await api("GET", "/api/meta");
  CURRENT = Object.keys(META.pipelines)[0];
  await render();
  const s = await refreshStatus();
  if (s && s.running) openStream();   // reprise du suivi si un run tourne déjà
})();
</script>
</body>
</html>
