<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>horus — pipelines</title>
<style>
  /* Thème clair, dense. Deux colonnes : réglages à gauche, logs à droite ;
     la barre d'actions reste collée en haut, les logs collés à leur colonne. */
  :root {
    --bg: #f6f7f9; --card: #ffffff; --soft: #f1f3f7; --line: #e3e7ee;
    --fg: #111827; --muted: #6b7280; --accent: #4f46e5; --accent-soft: #eef2ff;
    --ok: #059669; --warn: #b45309; --danger: #dc2626;
    --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    --r: 9px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
    font: 13px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }

  /* ── barre d'actions ── */
  .topbar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center;
    gap: 10px; padding: 7px 16px; background: rgba(255,255,255,.92);
    backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
  .brand { font-weight: 650; font-size: 13.5px; letter-spacing: -.01em; }
  .spacer { flex: 1; }

  /* Sélecteurs segmentés : onglets de pipeline et choix du mode. */
  .seg { display: inline-flex; gap: 2px; padding: 2px; background: var(--soft);
    border: 1px solid var(--line); border-radius: 8px; }
  .seg button, .seg label { border: 0; background: transparent; color: var(--muted);
    padding: 3px 10px; border-radius: 6px; font: inherit; font-size: 12.5px;
    cursor: pointer; white-space: nowrap; }
  .seg button.active, .seg input:checked + label { background: var(--card); color: var(--fg);
    box-shadow: 0 1px 2px rgba(17,24,39,.10); }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg input:checked + label.real { color: var(--danger); }

  .btn { border: 1px solid var(--line); background: var(--card); color: var(--fg);
    border-radius: 7px; padding: 4px 12px; font: inherit; font-size: 12.5px;
    font-weight: 550; cursor: pointer; }
  .btn:hover:not(:disabled) { background: var(--soft); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
  .btn.danger { background: var(--card); border-color: #f3c7c7; color: var(--danger); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }

  /* ── colonnes ── */
  .cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(380px, 40%);
    gap: 12px; align-items: start; padding: 12px 16px 20px; }
  @media (max-width: 1080px) { .cols { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r);
    padding: 10px 14px; margin-bottom: 10px; }
  .card > h2 { margin: 0 0 7px; font-size: 10.5px; font-weight: 650;
    text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
  .note { font-size: 11px; color: var(--muted); }
  .note.warn { color: var(--warn); }
  .note.err { color: var(--danger); }
  .note.ok { color: var(--ok); }

  /* ── étapes : un interrupteur, un titre, puis ses réglages ── */
  .step { padding: 9px 0; border-top: 1px solid var(--line); }
  .step:first-of-type { border-top: 0; padding-top: 2px; }
  .step-head { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .step-num { font-family: var(--mono); font-size: 11px; font-weight: 600;
    color: var(--accent); background: var(--accent-soft); border-radius: 5px;
    padding: 1px 6px; }
  .step-title { font-weight: 600; }
  .step-desc { color: var(--muted); font-weight: 400; }
  .step-body { margin: 5px 0 0 38px; }
  .step.off .step-body { opacity: .45; }

  /* Interrupteur (étapes + réglages booléens) plutôt qu'une case à cocher. */
  .switch { appearance: none; -webkit-appearance: none; flex: none; position: relative;
    width: 30px; height: 17px; border-radius: 999px; background: #d3d8e0;
    border: 0; cursor: pointer; transition: background .15s; }
  .switch:checked { background: var(--accent); }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px;
    width: 13px; height: 13px; border-radius: 50%; background: #fff;
    box-shadow: 0 1px 2px rgba(17,24,39,.3); transition: transform .15s; }
  .switch:checked::after { transform: translateX(13px); }

  /* ── réglages : libellé à gauche (colonne fixe), valeur à droite ── */
  .field { display: grid; grid-template-columns: 260px minmax(0, 1fr);
    gap: 2px 14px; align-items: center; padding: 2.5px 0; }
  .field > label { font-size: 12.5px; }
  .field .value { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .field .help { font-size: 11px; line-height: 1.3; color: var(--muted); max-width: 460px; }
  .field .key { font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
  .field input[type=text], .field input[type=password], .field input[type=number],
  .field select, .field textarea {
    background: var(--card); color: var(--fg); border: 1px solid var(--line);
    border-radius: 6px; padding: 3px 8px; font: inherit; font-size: 12.5px; width: 100%; }
  .field input[type=text], .field input[type=password] { max-width: 360px; }
  .field input[type=number] { max-width: 96px; }
  .field select { width: auto; max-width: 150px; }
  .field textarea { max-width: 440px; min-height: 46px; font-family: var(--mono);
    font-size: 12px; resize: vertical; }
  .field :focus-visible { outline: 2px solid rgba(79,70,229,.4); outline-offset: 1px;
    border-color: var(--accent); }
  @media (max-width: 720px) { .field { grid-template-columns: 1fr; align-items: start; } }

  /* ── logs ── */
  .logs { position: sticky; top: 50px; }
  .logs-head { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #c3c9d4; flex: none; }
  .dot.run { background: var(--ok); box-shadow: 0 0 0 3px rgba(5,150,105,.18);
    animation: pulse 1.3s infinite; }
  .dot.err { background: var(--danger); box-shadow: 0 0 0 3px rgba(220,38,38,.15); }
  @keyframes pulse { 50% { opacity: .35; } }
  .console { background: #fbfcfe; border: 1px solid var(--line); border-radius: 7px;
    height: calc(100vh - 132px); min-height: 240px; overflow: auto; padding: 8px 10px;
    font-family: var(--mono); font-size: 11.5px; line-height: 1.4;
    white-space: pre-wrap; color: #26313f; }
  .console .cmd { color: var(--accent); }
  .console .end { color: var(--warn); }
</style>
</head>
<body>

<header class="topbar">
  <span class="brand">🦅 horus</span>
  <div class="seg" id="tabs"></div>
  <span class="spacer"></span>
  <span class="note warn" id="realWarn" style="display:none">⚠ opérations destructrices</span>
  <div class="seg" id="modes">
    <input type="radio" name="mode" id="mode-dry" value="dry-run" checked>
    <label for="mode-dry">Simulation</label>
    <input type="radio" name="mode" id="mode-real" value="real">
    <label for="mode-real" class="real">Réel</label>
  </div>
  <span class="note" id="cfgToast"></span>
  <button class="btn" id="saveBtn">Enregistrer</button>
  <button class="btn primary" id="goBtn">Lancer</button>
  <button class="btn danger" id="stopBtn" disabled>Arrêter</button>
</header>

<main class="cols">
  <section id="panels"></section>
  <section class="logs">
    <div class="logs-head">
      <span class="dot" id="dot"></span>
      <strong id="statusText">Inactif</strong>
      <span class="note" id="statusMeta"></span>
      <span class="spacer"></span>
      <button class="btn" id="clearBtn">Effacer</button>
    </div>
    <div class="console" id="console"></div>
  </section>
</main>

<script>
let META = null;
let CURRENT = null;        // pipeline actif (onglet)
let STREAM = null;         // EventSource
let RUNNING = false;

const $ = (s, r=document) => r.querySelector(s);
const el = (t, props={}, ...kids) => {
  const n = document.createElement(t);
  for (const [k,v] of Object.entries(props)) {
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  kids.flat().forEach(c => n.append(c));
  return n;
};

async function api(method, path, body) {
  const r = await fetch(path, {
    method,
    headers: body ? {"Content-Type": "application/json"} : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || ("HTTP " + r.status));
  return data;
}

// ── construction de l'UI ──
function buildTabs() {
  const tabs = $("#tabs");
  tabs.innerHTML = "";
  for (const [key, p] of Object.entries(META.pipelines)) {
    tabs.append(el("button", {
      class: key === CURRENT ? "active" : "",
      text: p.short || key,
      title: p.label,
      onclick: () => { CURRENT = key; render(); },
    }));
  }
}

const inputId = (p, k) => `cfg-${p}-${k}`;

function fieldInput(pipeline, f, value) {
  // Libellé à gauche, valeur à droite ; booléens rendus en interrupteur.
  let input;
  if (f.type === "bool") {
    input = el("input", {type: "checkbox", class: "switch", id: inputId(pipeline, f.key)});
    input.checked = !!value;
  } else if (f.type === "choice") {
    input = el("select", {id: inputId(pipeline, f.key)});
    f.choices.forEach(c => {
      const o = el("option", {value: c, text: c});
      if (c === value) o.selected = true;
      input.append(o);
    });
  } else if (f.type === "list") {
    input = el("textarea", {id: inputId(pipeline, f.key)});
    input.value = Array.isArray(value) ? value.join("\n") : (value || "");
  } else if (f.type === "int" || f.type === "float") {
    input = el("input", {type: "number", id: inputId(pipeline, f.key)});
    if (f.type === "float") input.setAttribute("step", "any");
    input.value = value ?? "";
  } else { // str, str_or_none
    // Champs secrets (clés d'API) : saisie masquée. La valeur reste stockée en
    // clair dans 00-config.local.py (gitignoré) — c'est une config locale.
    input = el("input", {type: f.secret ? "password" : "text", id: inputId(pipeline, f.key)});
    input.value = value == null ? "" : value;
  }
  // Le libellé donne le nom lisible ; la clé de config reste affichée en petit,
  // c'est elle qu'on retrouve dans 00-config.py.
  return el("div", {class: "field"},
    el("label", {for: input.id},
      el("div", {text: f.label}),
      el("div", {class: "key", text: f.key})),
    el("div", {class: "value"}, input,
      f.help ? el("div", {class: "help", text: f.help}) : ""));
}

function readField(pipeline, f) {
  const node = $("#" + inputId(pipeline, f.key));
  if (f.type === "bool") return node.checked;
  if (f.type === "int") return node.value === "" ? 0 : parseInt(node.value, 10);
  if (f.type === "float") return node.value === "" ? 0 : parseFloat(node.value);
  if (f.type === "list") return node.value.split("\n").map(s => s.trim()).filter(Boolean);
  return node.value;
}

// « clean — nettoie les noms » → ["clean", "nettoie les noms"]
function splitDesc(desc) {
  const i = desc.indexOf(" — ");
  return i === -1 ? [desc, ""] : [desc.slice(0, i), desc.slice(i + 3)];
}

async function render() {
  buildTabs();
  const p = META.pipelines[CURRENT];
  const panels = $("#panels");
  panels.innerHTML = "";

  // valeurs courantes (00-config.py + surcouche 00-config.local.py)
  let values = {}, overlay = null, cfgError = null;
  try {
    const r = await api("GET", "/api/config/" + CURRENT);
    values = r.values; overlay = r.overlay;
  } catch (e) {
    cfgError = e.message;
  }

  // Les champs portant "step" sont rendus SOUS l'étape qu'ils règlent ; les
  // autres (dossiers, mode, webhook) vont dans la carte « Général ».
  const byStep = {}, common = [];
  p.fields.forEach(f => {
    if (f.step) (byStep[f.step] = byStep[f.step] || []).push(f);
    else common.push(f);
  });

  const gen = el("div", {class: "card"}, el("h2", {text: "Général · " + p.label}));
  if (cfgError) gen.append(el("div", {class: "note err", text: "Erreur lecture config : " + cfgError}));
  if (overlay) {
    gen.append(el("div", {class: "note", text: "Surcouche active : " + overlay
      + " — ces valeurs écrasent 00-config.py."}));
  }
  common.forEach(f => gen.append(fieldInput(CURRENT, f, values[f.key])));
  panels.append(gen);

  const stepsCard = el("div", {class: "card"}, el("h2", {text: "Étapes & options"}));
  if (p.steps) {
    // [id, description] ou [id, description, cochée_par_défaut] : l'étape 03 du
    // pipeline public (identification en ligne) est décochée par défaut.
    p.steps.forEach(([id, desc, checked]) => {
      const cb = el("input", {type: "checkbox", class: "switch step-cb", value: id,
                              id: `step-${id}`});
      cb.checked = checked !== false;
      const [name, rest] = splitDesc(desc);
      const head = el("label", {class: "step-head", for: cb.id}, cb,
        el("span", {class: "step-num", text: id}),
        el("span", {class: "step-title", text: name},
          rest ? el("span", {class: "step-desc", text: " — " + rest}) : ""));
      const fields = byStep[id] || [];
      const body = el("div", {class: "step-body"});
      if (fields.length) fields.forEach(f => body.append(fieldInput(CURRENT, f, values[f.key])));
      else body.append(el("div", {class: "note", text: "Aucune option propre à cette étape."}));
      const step = el("div", {class: "step"}, head, body);
      // Étape désactivée : ses réglages restent lisibles mais estompés.
      const sync = () => step.classList.toggle("off", !cb.checked);
      cb.addEventListener("change", sync);
      sync();
      stepsCard.append(step);
    });
  } else {
    stepsCard.append(el("div", {class: "note", text: "Ce pipeline n'a pas d'étapes sélectionnables."}));
  }
  panels.append(stepsCard);
  applyRunningState();
}

const pickedMode = () => (document.querySelector('input[name=mode]:checked') || {}).value || "dry-run";

function toast(msg, cls) {
  const t = $("#cfgToast");
  t.className = "note " + (cls || "");
  t.textContent = msg;
  if (msg) setTimeout(() => { if (t.textContent === msg) t.textContent = ""; }, 4000);
}

// ── actions ──
async function doRun() {
  const p = META.pipelines[CURRENT];
  const mode = pickedMode();
  let steps = null;
  if (p.steps) {
    steps = [...document.querySelectorAll('input.step-cb:checked')].map(c => c.value);
    if (steps.length === 0) { alert("Sélectionne au moins une étape."); return; }
  }
  if (mode === "real") {
    const what = p.steps ? `étapes ${steps.join(" ")}` : "01 → 02";
    if (!confirm(`Mode RÉEL sur « ${p.label} » (${what}).\nOpérations destructrices possibles. Continuer ?`)) return;
  }
  // Enregistre d'abord la config affichée dans la surcouche 00-config.local.py :
  // le lanceur relit la config sur le disque, donc sans cette sauvegarde les
  // modifs du formulaire seraient ignorées. Le 00-config.py versionné, lui,
  // n'est jamais réécrit — plus de bruit dans git à chaque lancement.
  const payload = {};
  p.fields.forEach(f => payload[f.key] = readField(CURRENT, f));
  try {
    await api("POST", "/api/config/" + CURRENT, payload);
  } catch (e) {
    alert("Échec de l'enregistrement de la config (lancement annulé) : " + e.message);
    return;
  }
  try {
    $("#console").textContent = "";
    await api("POST", "/api/run", {pipeline: CURRENT, mode, steps});
    openStream();
    await refreshStatus();
  } catch (e) {
    alert("Échec du lancement : " + e.message);
  }
}

async function doStop() {
  if (!confirm("Arrêter le run en cours ?")) return;
  try { await api("POST", "/api/stop"); } catch (e) { alert(e.message); }
}

async function saveConfig() {
  const p = META.pipelines[CURRENT];
  const payload = {};
  p.fields.forEach(f => payload[f.key] = readField(CURRENT, f));
  try {
    await api("POST", "/api/config/" + CURRENT, payload);
    toast("✓ Enregistré dans 00-config.local.py", "ok");
  } catch (e) {
    toast("✗ " + e.message, "err");
  }
}

// ── logs / statut ──
function appendLine(line) {
  const c = $("#console");
  const atBottom = c.scrollHeight - c.scrollTop - c.clientHeight < 40;
  const cls = line.startsWith("$ ") ? "cmd" : (line.startsWith("===") ? "end" : "");
  c.append(el("div", {class: cls, text: line}));
  if (atBottom) c.scrollTop = c.scrollHeight;
}

function openStream() {
  if (STREAM) STREAM.close();
  STREAM = new EventSource("/api/stream");
  STREAM.onmessage = (e) => appendLine(JSON.parse(e.data).line);
  STREAM.addEventListener("end", () => { STREAM.close(); STREAM = null; refreshStatus(); });
  STREAM.onerror = () => { /* le navigateur retentera ; ignore */ };
}

function setRunning(running, meta) {
  RUNNING = running;
  const dot = $("#dot"), txt = $("#statusText"), sub = $("#statusMeta");
  if (running) {
    dot.className = "dot run"; txt.textContent = "En cours";
  } else if (meta && meta.exit_code != null && meta.exit_code !== 0) {
    dot.className = "dot err"; txt.textContent = "Échec";
  } else {
    dot.className = "dot"; txt.textContent = meta && meta.pipeline ? "Terminé" : "Inactif";
  }
  sub.textContent = meta && meta.pipeline
    ? `${meta.pipeline} · ${meta.mode}${meta.steps && meta.steps.length ? " · " + meta.steps.join(" ") : ""}`
      + (meta.started ? ` · ${meta.started}` : "")
      + (meta.exit_code != null ? ` · code ${meta.exit_code}` : "")
    : "";
  applyRunningState();
}

function applyRunningState() {
  $("#stopBtn").disabled = !RUNNING;
  $("#goBtn").disabled = RUNNING;
  $("#saveBtn").disabled = RUNNING;
}

async function refreshStatus() {
  try {
    const s = await api("GET", "/api/status");
    setRunning(s.running, s.meta);
    return s;
  } catch (e) { return null; }
}

// ── init ──
(async function init() {
  $("#goBtn").addEventListener("click", doRun);
  $("#saveBtn").addEventListener("click", saveConfig);
  $("#stopBtn").addEventListener("click", doStop);
  $("#clearBtn").addEventListener("click", () => { $("#console").textContent = ""; });
  document.querySelectorAll('input[name=mode]').forEach(r =>
    r.addEventListener("change", () => {
      $("#realWarn").style.display = pickedMode() === "real" ? "inline" : "none";
    }));
  META = await api("GET", "/api/meta");
  CURRENT = Object.keys(META.pipelines)[0];
  await render();
  const s = await refreshStatus();
  if (s && s.running) openStream();   // reprise du suivi si un run tourne déjà
})();
</script>
</body>
</html>
