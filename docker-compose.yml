services:
  convert-h265:
    build:
      context: .
      dockerfile: Dockerfile
    image: horus-convert-h265
    # Tous les réglages viennent de src/public-media/00-config.py (monté en LIVE
    # ci-dessous), lu par les scripts via importlib — plus d'env_file ni de
    # variables d'environnement. NAS_MOUNT (pour le volume ci-dessous) est
    # exporté par run-public-media-pipeline.sh, qui le lit dans 00-config.py.
    # Accès GPU NVIDIA pour NVENC (hevc_nvenc).
    # Nécessite nvidia-container-toolkit installé et configuré sur l'hôte.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, video]
    volumes:
      # NAS en LECTURE-ÉCRITURE : le script supprime les originaux et écrit les
      # fichiers convertis. NE PAS mettre en lecture seule (:ro).
      - ${NAS_MOUNT}:${NAS_MOUNT}
      # Scripts + 00-config.py montés en LIVE (comme le pipeline perso) : éditer
      # la config prend effet sans rebuild.
      - ./src/public-media:/work
    working_dir: /work
    environment:
      # Surcharge éventuelle du DRY_RUN par le lanceur (--dry-run/--real). Si la
      # variable n'est pas définie côté hôte, les scripts retombent sur la valeur
      # de 00-config.py. Forme « clé sans valeur » = transmission de l'env hôte.
      - PIPELINE_DRY_RUN
    # On nettoie d'abord les noms (renommage), puis on convertit en HEVC.
    # Les deux scripts partagent INPUT_FOLDERS / DRY_RUN (via 00-config.py).
    command: ["sh", "-c", "python3 01-clean-names.py && python3 02-convert-to-h265.py"]
    # Tâche ponctuelle, pas un service permanent
    restart: "no"

  # Le pipeline perso (01->04) ne passe PAS par docker-compose : il est lancé
  # par run-perso-media-pipeline.sh, qui orchestre les 4 étapes en `docker run` (mêmes
  # image et réglages 00-config.py). Aucun service compose perso ici.
