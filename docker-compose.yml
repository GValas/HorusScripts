services:
  convert-h265:
    build:
      context: .
      dockerfile: Dockerfile
    image: horus-convert-h265
    env_file: env/.env
    environment:
      # Surcharge le DRY_RUN d'env/.env par celui exporté par run-convert-h265.sh
      # (le shell est prioritaire sur env/.env pour l'interpolation ${...}).
      DRY_RUN: ${DRY_RUN:-false}
    # Accès GPU NVIDIA pour NVENC (hevc_nvenc).
    # Nécessite nvidia-container-toolkit installé et configuré sur l'hôte.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, video]
    volumes:
      # NAS en LECTURE-ÉCRITURE : le script supprime les originaux et écrit les
      # fichiers convertis. NE PAS mettre en lecture seule (:ro).
      - ${NAS_MOUNT}:${NAS_MOUNT}
    # On nettoie d'abord les noms (renommage), puis on convertit en HEVC.
    # Les deux scripts partagent INPUT_FOLDERS / DRY_RUN (via env/.env).
    command: ["sh", "-c", "python3 01-clean-names.py && python3 02-convert-to-h265.py"]
    # Tâche ponctuelle, pas un service permanent
    restart: "no"

  # Le pipeline perso (01->04) ne passe PAS par docker-compose : il est lancé
  # par run-perso-pipeline.sh, qui orchestre les 4 étapes en `docker run` (mêmes
  # image et réglages 00-config.py). Aucun service compose perso ici.
